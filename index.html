<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Workout</title>
<style>
  :root{
    --bg:#000;
    --text:#eee;
    --dim:#555;
    --line:#2a2a2a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    color:var(--text);
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    letter-spacing:0.01em;
    -webkit-tap-highlight-color:transparent;
  }
  input{font-family:inherit;}
  #app{max-width:520px;margin:0 auto;padding:10px 10px 70px;}

  .tabs{
    display:flex;justify-content:space-between;align-items:baseline;
    position:sticky;top:0;z-index:10;
    background:var(--bg);
    padding:10px 0 10px;
    margin:-10px -10px 4px;
    padding-left:10px;padding-right:10px;
  }
  .tab{color:var(--dim);font-size:15px;background:none;border:none;padding:6px 4px;}
  .tab.active{color:var(--text);border-bottom:2px solid var(--text);}

  .colhead{
    display:flex;align-items:center;font-size:10px;color:var(--dim);
    padding:0 0 4px;margin-bottom:2px;
  }
  .ch-tag{width:26px;flex:none;}
  .ch-name{flex:1 1 auto;}
  .ch-scheme{width:44px;flex:none;text-align:center;}
  .ch-prev{width:34px;flex:none;text-align:center;}
  .ch-done{width:20px;flex:none;text-align:center;}

  .ex-block{}
  .ex-row{
    display:flex;align-items:center;
    height:36px;
  }
  .ex-row.done{opacity:0.45;}
  .editctl{
    display:flex;align-items:center;flex:none;
    width:110px;overflow:hidden;
  }
  .editctl.hidden-ctl{visibility:hidden;}
  .rm{width:20px;flex:none;background:none;border:none;color:#fff;font-size:20px;padding:0;margin-left:6px;line-height:1;}
  .tag{width:26px;flex:none;font-size:12px;color:var(--dim);text-transform:uppercase;}
  .name{flex:1 1 auto;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .scheme{width:44px;flex:none;font-size:12px;color:var(--dim);text-align:center;}
  .prev{width:34px;flex:none;font-size:12px;color:var(--dim);text-align:center;}
  .doneMark{width:20px;flex:none;font-size:13px;text-align:center;}
  .reorder{display:flex;align-items:flex-start;gap:12px;flex:none;margin-left:10px;}
  .reorder button{background:none;border:none;padding:6px;display:flex;align-items:flex-start;justify-content:center;color:var(--text);}
  .reorder button:disabled{opacity:0.2;}

  .setpanel{padding:4px 0 10px 26px;}
  .set-colhead{
    display:flex;align-items:center;font-size:10px;color:var(--dim);
    margin-bottom:4px;
  }
  .sc-num{width:26px;flex:none;}
  .sc-reps{width:56px;flex:none;text-align:right;}
  .sc-weight{width:56px;flex:none;text-align:right;}
  .sc-done{width:36px;flex:none;text-align:center;}

  .setrow{display:flex;align-items:center;font-size:14px;margin-bottom:6px;}
  .setrow.done{opacity:0.45;}
  .set-num{width:26px;flex:none;color:var(--dim);}
  .set-reps,.set-weight{
    width:56px;flex:none;text-align:right;
    background:none;border:none;color:inherit;font-family:inherit;font-size:14px;
  }
  .set-done{
    width:36px;flex:none;text-align:center;
    background:none;border:none;color:var(--dim);font-size:14px;
  }
  .setrow.done .set-done{color:var(--text);}
  .setctl{background:none;border:none;color:var(--dim);font-size:13px;padding:2px 6px 0 26px;}

  .addrow{
    display:flex;align-items:center;
    padding:8px 0;
    font-size:13px;color:var(--dim);
  }
  .addrow input{
    background:none;border:none;
    color:var(--text);font-family:inherit;font-size:13px;
    padding:0;
  }
  .addrow input.tag{width:26px;flex:none;border-bottom:1px solid var(--line);}
  .addrow input.n{flex:1 1 auto;min-width:0;border-bottom:1px solid var(--line);margin-right:6px;}
  .addrow input.s{width:44px;flex:none;text-align:center;border-bottom:1px solid var(--line);margin-right:6px;}
  .addbtn{background:none;border:1px solid var(--line);color:var(--text);
    font-family:inherit;font-size:13px;padding:4px 8px;flex:none;}

  .footer{
    position:fixed;bottom:0;left:0;right:0;
    max-width:520px;margin:0 auto;
    display:flex;background:#000;height:52px;
  }
  .footer button{flex:1;background:none;border:none;color:var(--text);
    font-family:inherit;display:flex;align-items:center;justify-content:center;height:100%;}
  .footer button.footerBtn{font-size:20px;border-bottom:2px solid transparent;}
  .footer button.footerBtn.active{border-bottom-color:#fff;color:#fff;}
  .footer button.footerBtn.enabled{color:#fff;}

  .type-section{margin-bottom:20px;}
  .type-title{font-size:15px;font-weight:bold;padding-bottom:4px;margin-bottom:6px;}
  .sess{margin-bottom:10px;}
  .sess-date{font-size:12px;color:var(--dim);margin-bottom:2px;}
  .sess-ex{font-size:13px;margin-bottom:2px;}
  .sess-ex .en{color:var(--text);}
  .sess-ex .sd{color:var(--dim);}

  .hist-colhead{
    display:flex;align-items:center;font-size:10px;color:var(--dim);
    padding-bottom:4px;margin-bottom:4px;
  }
  .hist-ch-name{flex:1 1 auto;}
  .hist-ch-set{width:50px;flex:none;text-align:center;}
  .hist-row{display:flex;align-items:center;font-size:13px;padding:5px 0;}
  .hist-row .tag{width:24px;flex:none;color:var(--dim);font-size:11px;}
  .hist-row .name{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hist-set{width:50px;flex:none;text-align:center;color:var(--dim);}
  .empty{color:var(--dim);font-size:13px;}

  .stat-row{
    display:flex;align-items:center;
    padding:8px 0;
    font-size:14px;
  }
  .stat-row .tag{width:26px;flex:none;font-size:12px;color:var(--dim);}
  .stat-row .name{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .stat-row .type{width:44px;flex:none;font-size:11px;color:var(--dim);text-align:right;}
  .stats-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 0;font-size:14px;
  }
  .stats-row .left{display:flex;align-items:center;overflow:hidden;flex:1 1 auto;margin-right:8px;}
  .stats-row .left .tag{width:24px;flex:none;color:var(--dim);font-size:12px;}
  .stats-row .left .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hist-date-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;}
  .hist-date-row .name{flex:none;font-size:14px;}
  .hist-groups{display:flex;gap:8px;flex:none;}
  .hist-groups span{color:var(--line);font-size:10px;}
  .hist-groups span.active{color:var(--text);}
  .stat-back{background:none;border:none;color:var(--dim);font-size:13px;padding:8px 0;margin-bottom:6px;}
  .stat-title{font-size:15px;margin-bottom:10px;}
  .chart-empty{color:var(--dim);font-size:13px;padding:20px 0;}
</style>
</head>
<body>
<div id="app"></div>

function measureTextWidth(text, font){
  if(!measureTextWidth._canvas) measureTextWidth._canvas = document.createElement('canvas');
  const ctx = measureTextWidth._canvas.getContext('2d');
  ctx.font = font;
  return ctx.measureText(text).width;
}

function buildChevron(direction){
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', '16');
  svg.setAttribute('height', '11');
  svg.setAttribute('viewBox', '0 0 16 11');
  svg.style.display = 'block';
  const poly = document.createElementNS(NS, 'polyline');
  poly.setAttribute('points', direction === 'up' ? '1,10 8,1 15,10' : '1,1 8,10 15,1');
  poly.setAttribute('fill', 'none');
  poly.setAttribute('stroke', 'currentColor');
  poly.setAttribute('stroke-width', '2');
  poly.setAttribute('stroke-linecap', 'round');
  poly.setAttribute('stroke-linejoin', 'round');
  svg.appendChild(poly);
  return svg;
}

function schemeSetCount(scheme){
  const m = /^(\d+)/.exec(scheme || '');
  const n = m ? parseInt(m[1],10) : 3;
  return Math.max(1, Math.min(n, 8));
}

function schemeReps(scheme){
  const m = /x\s*(\d+)/i.exec(scheme || '');
  return m ? parseInt(m[1],10) : 10;
}

function withSetCount(scheme, count){
  return count + 'x' + schemeReps(scheme);
}

function defaultData(){
  return {
    catalog: defaultCatalog(),
    exercises: {push: [], pull: [], legs: [], core: []},
    maxWeights: {},
    history: {push:[], pull:[], legs:[], core:[]},
    drafts: {}
  };
}

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultData();
    const d = JSON.parse(raw);
    if(!d.exercises || !d.history) return defaultData();
    if(!d.catalog) d.catalog = defaultCatalog();
    if(!d.drafts) d.drafts = {};
    ['push','pull','legs','core'].forEach(t => {
      if(!d.history[t]) d.history[t] = [];
      if(!d.exercises[t]) d.exercises[t] = [];
      if(!d.catalog[t]) d.catalog[t] = [];
    });
    return d;
  }catch(e){ return defaultData(); }
}

function emptySets(n, scheme, maxWeight){
  const reps = schemeReps(scheme);
  return Array.from({length:n}, () => ({
    reps: reps ? String(reps) : '',
    weight: maxWeight ? String(maxWeight) : '',
    done:false
  }));
}

function draftFor(type){
  if(!state.drafts[type]) state.drafts[type] = {};
  const d = state.drafts[type];
  state.exercises[type].forEach(ex => {
    const n = schemeSetCount(ex.scheme);
    const maxW = state.maxWeights[ex.id];
    if(!d[ex.id]) d[ex.id] = {sets: emptySets(n, ex.scheme, maxW)};
    while(d[ex.id].sets.length < n){
      d[ex.id].sets.push({
        reps: schemeReps(ex.scheme) ? String(schemeReps(ex.scheme)) : '',
        weight: maxW ? String(maxW) : '',
        done:false
      });
    }
  });
  return d;
}

function allSetsDone(entry){
  return entry.sets.length > 0 && entry.sets.every(s => s.done);
}

function modeReps(sets){
  const counts = {};
  sets.forEach(s => {
    const r = parseInt(s.reps, 10);
    if(!isNaN(r)) counts[r] = (counts[r] || 0) + 1;
  });
  let best = null, bestCount = 0;
  Object.keys(counts).forEach(k => {
    const n = parseInt(k, 10);
    if(counts[k] > bestCount || (counts[k] === bestCount && (best === null || n > best))){
      best = n; bestCount = counts[k];
    }
  });
  return best;
}

function prevMax(id){ return state.maxWeights[id] || null; }

function buildChart(points, selectedIdx, onSelect){
  const NS = 'http://www.w3.org/2000/svg';
  const W = 300, H = 180, padL = 34, padR = 10, padT = 10, padB = 24;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;

  const xs = points.map(p => p.date.getTime());
  const ys = points.map(p => p.weight);
  let xmin = Math.min(...xs), xmax = Math.max(...xs);
  let ymin = Math.min(...ys), ymax = Math.max(...ys);
  if(xmin === xmax){ xmin -= 1; xmax += 1; }
  if(ymin === ymax){ ymin -= 1; ymax += 1; }
  const ypad = (ymax - ymin) * 0.15;
  ymin -= ypad; ymax += ypad;

  const sx = t => padL + ((t - xmin) / (xmax - xmin)) * plotW;
  const sy = w => padT + plotH - ((w - ymin) / (ymax - ymin)) * plotH;
  const fmtDate = d => d.toLocaleDateString(undefined,{month:'short',day:'numeric'});

  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', '100%');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.style.background = '#000';

  function el(tag, attrs){
    const e = document.createElementNS(NS, tag);
    Object.keys(attrs).forEach(k => e.setAttribute(k, attrs[k]));
    return e;
  }

  svg.appendChild(el('line', {x1:padL, y1:padT, x2:padL, y2:padT+plotH, stroke:'#333'}));
  svg.appendChild(el('line', {x1:padL, y1:padT+plotH, x2:padL+plotW, y2:padT+plotH, stroke:'#333'}));

function getHistoryRows(historyTypeFilter){
  let rows;
  if(historyTypeFilter === null){
    const byDate = {};
    ['push','pull','legs','core'].forEach(type => {
      state.history[type].forEach((rec, index) => {
        const d = new Date(rec.date);
        const key = d.toDateString();
        if(!byDate[key]) byDate[key] = {date: d, items: []};
        byDate[key].items.push({type, index});
      });
    });
    rows = Object.values(byDate);
  } else {
    rows = state.history[historyTypeFilter].map((rec, index) => ({
      date: new Date(rec.date),
      items: [{type: historyTypeFilter, index}]
    }));
  }
  rows.sort((a,b) => b.date - a.date);
  return rows;
}

function buildCalendarGrid(monthDate, historyTypeFilter, onPickDay){
  const year = monthDate.getFullYear();
  const month = monthDate.getMonth();
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const daysWithData = {};
  const types = historyTypeFilter === null ? ['push','pull','legs','core'] : [historyTypeFilter];
  types.forEach(t => {
    state.history[t].forEach((rec, index) => {
      const d = new Date(rec.date);
      if(d.getFullYear() === year && d.getMonth() === month){
        const day = d.getDate();
        if(!daysWithData[day]) daysWithData[day] = [];
        daysWithData[day].push({type: t, index});
      }
    });
  });

  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;padding:0 32px;';

  const monthLabel = document.createElement('div');
  monthLabel.style.cssText = 'font-size:16px;margin-bottom:16px;text-align:center;font-weight:600;';
  monthLabel.textContent = monthDate.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  wrap.appendChild(monthLabel);

  const grid = document.createElement('div');
  grid.style.cssText = 'display:grid;grid-template-columns:repeat(7,1fr);gap:6px;';
  ['S','M','T','W','T','F','S'].forEach(d => {
    const h = document.createElement('div');
    h.style.cssText = 'text-align:center;font-size:11px;color:var(--dim);padding-bottom:8px;';
    h.textContent = d;
    grid.appendChild(h);
  });
  for(let i=0;i<startWeekday;i++){
    grid.appendChild(document.createElement('div'));
  }
  for(let day=1; day<=daysInMonth; day++){
    const cell = document.createElement('div');
    const hasData = !!daysWithData[day];
    cell.style.cssText = 'display:flex;flex-direction:column;align-items:center;justify-content:flex-start;' +
      'aspect-ratio:1;padding-top:6px;border-radius:' + (hasData ? '0' : '10px') + ';' +
      (hasData ? 'background:#222;' : '');

    const numEl = document.createElement('div');
    numEl.style.cssText = 'font-size:15px;color:#fff;' + (hasData ? 'font-weight:600;' : '');
    numEl.textContent = day;
    cell.appendChild(numEl);

    if(hasData){
      const done = new Set(daysWithData[day].map(i => i.type));
      const labelEl = document.createElement('div');
      labelEl.style.cssText = 'display:grid;grid-template-columns:auto auto;gap:0 4px;margin-top:3px;';
      ['push','pull','legs','core'].forEach(t => {
        const span = document.createElement('span');
        span.style.cssText = 'font-size:6px;line-height:1.4;color:' + (done.has(t) ? '#fff' : 'var(--dim)') + ';';
        span.textContent = t.toUpperCase();
        labelEl.appendChild(span);
      });
      cell.appendChild(labelEl);

      cell.onclick = () => onPickDay({date: new Date(year, month, day), items: daysWithData[day]});
    }
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);
  return wrap;
}

function buildExerciseHistoryTable(type, id){
  const sessions = state.history[type]
    .map(rec => ({date: new Date(rec.date), entry: rec.entries.find(e => e.exerciseId === id)}))
    .filter(s => s.entry && s.entry.sets.some(st => st.reps !== '' || st.weight !== ''));
  sessions.sort((a,b) => b.date - a.date);

  const wrap2 = document.createElement('div');
  if(sessions.length === 0){
    const e = document.createElement('div');
    e.className = 'chart-empty';
    e.textContent = 'no logged sets yet for this exercise';
    wrap2.appendChild(e);
    return wrap2;
  }

  let maxSets = 1;
  sessions.forEach(s => { if(s.entry.sets.length > maxSets) maxSets = s.entry.sets.length; });

  const colhead = document.createElement('div');
  colhead.className = 'hist-colhead';
  let ch = '<span class="hist-ch-name">date</span>';
  for(let i=1;i<=maxSets;i++) ch += `<span class="hist-ch-set">${i}</span>`;
  colhead.innerHTML = ch;

  return wrap2;

function seedTestData(){
  const now = Date.now();
  ['push','pull','legs','core'].forEach(type => {
    state.catalog[type].forEach(c => {
      if(!state.exercises[type].some(e => e.id === c.id)){
        state.exercises[type].push({id: c.id, tag: c.tag, name: c.name, scheme: '3x10'});
      }
    });

    const startWeights = {};
    state.exercises[type].forEach(ex => {
      startWeights[ex.id] = 20 + Math.round(Math.random()*30);
    });
    for(let session = 7; session >= 0; session--){
      const date = new Date(now - session * 6 * 24 * 60 * 60 * 1000);
      const entries = [];
      state.exercises[type].forEach(ex => {
        const n = schemeSetCount(ex.scheme);
        const reps = schemeReps(ex.scheme);
        const progressed = startWeights[ex.id] + (7 - session) * (2 + Math.random()*2);
        const sets = [];
        for(let i=0;i<n;i++){
          const wobble = Math.round((Math.random()-0.5) * 4);
          sets.push({
            reps: String(Math.max(1, reps - (Math.random() < 0.2 ? 1 : 0))),
            weight: String(Math.max(5, Math.round(progressed + wobble)))
          });
        }
        entries.push({exerciseId: ex.id, tag: ex.tag, name: ex.name, scheme: ex.scheme, sets});
        sets.forEach(s => {
          const w = parseFloat(s.weight);
          if(!isNaN(w)){
            const prev = state.maxWeights[ex.id] || 0;
            if(w > prev) state.maxWeights[ex.id] = w;
          }
        });
      });
      state.history[type].unshift({date: date.toISOString(), type, entries});
    }
    state.history[type].sort((a,b) => new Date(b.date) - new Date(a.date));
  });
  save();
}

function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dstr = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = 'workout-data-' + dstr + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

function normalizeState(d){
  if(!d.catalog) d.catalog = defaultCatalog();
  if(!d.drafts) d.drafts = {};
  if(!d.maxWeights) d.maxWeights = {};
  if(!d.history) d.history = {};
  if(!d.exercises) d.exercises = {};
  ['push','pull','legs','core'].forEach(t => {
    if(!d.history[t]) d.history[t] = [];
    if(!d.exercises[t]) d.exercises[t] = [];
    if(!d.catalog[t]) d.catalog[t] = [];
  });
  return d;
}

function importData(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.exercises || !parsed.history){
        showAlert('That file doesn\'t look like a valid backup.');
        return;
      }
      showModal('Replace all current data with this file?', {
        onConfirm: () => {
          state = normalizeState(parsed);
          save();
          render();
        }
      });
    }catch(e){
      showAlert('Could not read that file.');
    }
  };
  reader.readAsText(file);
}

function b64EncodeUnicode(str){
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,
    (match, p1) => String.fromCharCode(parseInt(p1, 16))));
}
function b64DecodeUnicode(str){
  return decodeURIComponent(atob(str).split('').map(c =>
    '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
}

async function ghPush(cfg, statusEl){
  if(!cfg.owner || !cfg.repo || !cfg.path || !cfg.token){
    statusEl.textContent = 'fill in owner, repo, path and token first';
    return;
  }
  statusEl.textContent = 'pushing...';
  const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${encodeURIComponent(cfg.path)}`;
  const headers = {
    'Authorization': 'Bearer ' + cfg.token,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  };
  try{
    let sha = null;
    const getRes = await fetch(url, {headers});
    if(getRes.status === 200){
      const j = await getRes.json();
      sha = j.sha;
    } else if(getRes.status !== 404){
      statusEl.textContent = 'error reading repo (' + getRes.status + ')';
      return;
    }
    const body = {
      message: 'workout data update ' + new Date().toISOString(),
      content: b64EncodeUnicode(JSON.stringify(state, null, 2))
    };
    if(sha) body.sha = sha;
    const putRes = await fetch(url, {method:'PUT', headers, body: JSON.stringify(body)});
    if(putRes.ok){
      statusEl.textContent = 'pushed ' + new Date().toLocaleTimeString();
    } else {
      const err = await putRes.json().catch(() => ({}));
      statusEl.textContent = 'push failed (' + putRes.status + ') ' + (err.message || '');
    }
  }catch(e){
    statusEl.textContent = 'network error: ' + e.message;
  }
}

async function ghPull(cfg, statusEl){
  if(!cfg.owner || !cfg.repo || !cfg.path || !cfg.token){
    statusEl.textContent = 'fill in owner, repo, path and token first';
    return;
  }
  statusEl.textContent = 'pulling...';
  const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${encodeURIComponent(cfg.path)}`;
  const headers = {
    'Authorization': 'Bearer ' + cfg.token,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  };
  try{
    const res = await fetch(url, {headers});
    if(res.status === 404){
      statusEl.textContent = 'no file found at that path yet';
      return;
    }
    if(!res.ok){
      statusEl.textContent = 'pull failed (' + res.status + ')';
      return;
    }
    const j = await res.json();
    const parsed = JSON.parse(b64DecodeUnicode(j.content.replace(/\n/g,'')));
    if(!parsed.exercises || !parsed.history){
      statusEl.textContent = 'file did not look like valid backup data';
      return;
    }
    showModal('Replace all current local data with the GitHub copy?', {
      onConfirm: () => {
        state = normalizeState(parsed);
        save();
        statusEl.textContent = 'pulled ' + new Date().toLocaleTimeString();
        render();
      },
      onCancel: () => { statusEl.textContent = 'cancelled'; }
    });
  }catch(e){
    statusEl.textContent = 'network error: ' + e.message;
  }
}

      inp.placeholder = ph;
      inp.type = type || 'text';
      inp.style.cssText = 'display:block;width:100%;background:none;border:none;border-bottom:1px solid var(--line);color:var(--text);font-family:inherit;font-size:13px;padding:4px 0;margin-bottom:6px;';
      return inp;
    };
    const ownerInp = mkInput(cfg.owner, 'owner (github username)');
    const repoInp = mkInput(cfg.repo, 'repo name');
    const pathInp = mkInput(cfg.path, 'file path e.g. workout-data.json');
    const tokenInp = mkInput(cfg.token, 'fine-grained access token', 'password');
    ghPanel.appendChild(ownerInp);
    ghPanel.appendChild(repoInp);
    ghPanel.appendChild(pathInp);
    ghPanel.appendChild(tokenInp);

    const statusEl = document.createElement('div');
    statusEl.style.cssText = 'font-size:12px;color:var(--dim);margin:4px 0 8px;';
    statusEl.textContent = ' ';

    const ghBtnRow = document.createElement('div');
    ghBtnRow.style.cssText = 'display:flex;gap:8px;';
    const pushBtn = document.createElement('button');
    pushBtn.className = 'addbtn';
    pushBtn.textContent = 'push to github';
    const pullBtn = document.createElement('button');
    pullBtn.className = 'addbtn';
    pullBtn.textContent = 'pull from github';

    const currentCfg = () => ({
      owner: ownerInp.value.trim(),
      repo: repoInp.value.trim(),
      path: pathInp.value.trim(),
      token: tokenInp.value.trim()
    });

    pushBtn.onclick = () => { const c = currentCfg(); saveGhConfig(c); ghPush(c, statusEl); };
    pullBtn.onclick = () => { const c = currentCfg(); saveGhConfig(c); ghPull(c, statusEl); };

    ghBtnRow.appendChild(pushBtn);
    ghBtnRow.appendChild(pullBtn);
    ghPanel.appendChild(statusEl);
    ghPanel.appendChild(ghBtnRow);
    app.appendChild(ghPanel);

    buildBottomBar({
      leftButton: {svg: buildLeftChevron(), enabled: true, onclick: () => { adminPanelOpen = false; render(); }}
    });
    return;
  }

  if(view === 'stats'){
    if(!statsSelected){
      const list = (statsType === null)
        ? ['push','pull','legs','core'].flatMap(type => state.exercises[type].map(ex => ({ex, type})))
        : state.exercises[statsType].map(ex => ({ex, type: statsType}));

      list.forEach(item => {
        const row = document.createElement('div');
        row.className = 'stats-row';
        let groupsHtml = '<div class="hist-groups">';
        ['push','pull','legs','core'].forEach(t => {
          groupsHtml += `<span class="${t === item.type ? 'active' : ''}">${t.toUpperCase()}</span>`;
        });
        groupsHtml += '</div>';
        row.innerHTML = `<span class="left"><span class="tag">${item.ex.tag}</span><span class="name">${item.ex.name}</span></span>${groupsHtml}`;
        row.onclick = () => { statsSelected = {type: item.type, id: item.ex.id}; chartSelectedIdx = null; render(); };
        app.appendChild(row);
      });
      buildBottomBar({
        middleButtons: [
          {svg: buildGraphIcon(), active: !statsShowTable, onclick: () => { statsShowTable = false; render(); }},
          {svg: buildTableIcon(), active: statsShowTable, onclick: () => { statsShowTable = true; render(); }}
        ],
        rightButton: {svg: buildLeftChevron(), disabled: true, onclick: () => {}}
      });
      return;
    }

    const ex = state.exercises[statsSelected.type].find(e => e.id === statsSelected.id);
    const title = document.createElement('div');
    title.className = 'stat-title';
    title.textContent = ex ? (ex.tag + ' ' + ex.name) : '';
    app.appendChild(title);

    if(statsShowTable){
      app.appendChild(buildExerciseHistoryTable(statsSelected.type, statsSelected.id));
    } else {
      const points = [];
      state.history[statsSelected.type].forEach(rec => {
        const entry = rec.entries.find(e => e.exerciseId === statsSelected.id);
        if(!entry) return;
        let max = null;
        entry.sets.forEach(s => {
          const w = parseFloat(s.weight);
          if(!isNaN(w) && (max === null || w > max)) max = w;
        });
        if(max !== null) points.push({date: new Date(rec.date), weight: max});
      });
      points.sort((a,b) => a.date - b.date);

      if(points.length === 0){
        const e = document.createElement('div');
        e.className = 'chart-empty';
        e.textContent = 'no logged sets yet for this exercise';
        app.appendChild(e);
      } else {
        app.appendChild(buildChart(points, chartSelectedIdx, (i) => { chartSelectedIdx = i; render(); }));
      }
    }

    buildBottomBar({
      middleButtons: [
        {svg: buildGraphIcon(), active: !statsShowTable, onclick: () => { statsShowTable = false; render(); }},
        {svg: buildTableIcon(), active: statsShowTable, onclick: () => { statsShowTable = true; render(); }}
      ],
      rightButton: {svg: buildLeftChevron(), enabled: true, onclick: () => { statsSelected = null; chartSelectedIdx = null; render(); }}
    });
    return;
  }

  if(view === 'history'){
    if(historyCalendarMonth === null){
      const now = new Date();
      historyCalendarMonth = new Date(now.getFullYear(), now.getMonth(), 1);
    }

    const calBtn = {
      svg: buildCalendarIcon(),
      active: historyCalendarOpen,
      onclick: () => {
        historyCalendarOpen = !historyCalendarOpen;
        if(historyCalendarOpen) historySelected = null;
        render();
      }
    };

    if(historyCalendarOpen){
      app.appendChild(buildCalendarGrid(historyCalendarMonth, historyType, (row) => {
        historySelected = row;
        historyCalendarOpen = false;
        render();
      }));
      buildBottomBar({
        rightButton: calBtn,
        middleButtons: [
          {svg: buildLeftChevron(), enabled: true, onclick: () => {
            historyCalendarMonth = new Date(historyCalendarMonth.getFullYear(), historyCalendarMonth.getMonth() - 1, 1);
            render();
          }},
          {svg: buildRightChevron(), enabled: true, onclick: () => {
            historyCalendarMonth = new Date(historyCalendarMonth.getFullYear(), historyCalendarMonth.getMonth() + 1, 1);
            render();
          }}
        ]
      });
      return;
    }

    if(!historySelected){
      const rows = getHistoryRows(historyType);

      if(rows.length === 0){
        const e = document.createElement('div');
        e.className = 'empty';
        e.textContent = 'no sessions saved yet';
        app.appendChild(e);
      } else {
        rows.forEach(row => {
          const el = document.createElement('div');
          const dstr = row.date.toLocaleDateString(undefined,{year:'2-digit',month:'2-digit',day:'2-digit'});
          const done = new Set(row.items.map(i => i.type));
          el.className = 'hist-date-row';
          let groupsHtml = '<div class="hist-groups">';
          ['push','pull','legs','core'].forEach(t => {
            groupsHtml += `<span class="${done.has(t) ? 'active' : ''}">${t.toUpperCase()}</span>`;
          });
          groupsHtml += '</div>';
          el.innerHTML = `<span class="name">${dstr}</span>${groupsHtml}`;
          el.onclick = () => { historySelected = row; render(); };
          app.appendChild(el);
        });
      }
      buildBottomBar({
        rightButton: calBtn,
        middleButtons: [
          {svg: buildLeftChevron(), disabled: true, onclick: () => {}},
          {svg: buildRightChevron(), disabled: true, onclick: () => {}}
        ]
      });
      return;
    }

    const recs = historySelected.items
      .map(i => ({type: i.type, rec: state.history[i.type][i.index]}))
      .filter(r => r.rec);

    if(recs.length === 0){
      historySelected = null;
      render();
      return;
    }

    const dstr = new Date(recs[0].rec.date).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
    const title = document.createElement('div');
    title.className = 'stat-title';
    title.textContent = recs.map(r => r.type.toUpperCase()).join(' + ') + ' \u2013 ' + dstr;
    app.appendChild(title);

    recs.forEach(({type, rec}) => {
      if(recs.length > 1){
        const groupLabel = document.createElement('div');
        groupLabel.style.cssText = 'font-size:12px;color:var(--dim);margin:10px 0 4px;text-transform:uppercase;';
        groupLabel.textContent = type;
        app.appendChild(groupLabel);
      }

      const entries = rec.entries.filter(e => e.sets.some(st => st.reps !== '' || st.weight !== ''));
      let maxSets = 1;
      entries.forEach(e => { if(e.sets.length > maxSets) maxSets = e.sets.length; });

      const nameFont = '14px -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif';
      let maxNameW = 0;
      entries.forEach(e => {
        const w = measureTextWidth(e.name, nameFont);
        if(w > maxNameW) maxNameW = w;
      });
      maxNameW = Math.ceil(maxNameW) + 6;

      const colhead = document.createElement('div');
      colhead.className = 'hist-colhead';
      let chHtml = '<span class="hist-ch-name">exercise</span>';
      for(let i=1;i<=maxSets;i++) chHtml += `<span class="hist-ch-set">${i}</span>`;
      colhead.innerHTML = chHtml;
      colhead.querySelector('.hist-ch-name').style.cssText = 'flex:none;width:' + (maxNameW + 26) + 'px;';
      app.appendChild(colhead);

      entries.forEach(e => {
        const row = document.createElement('div');
        row.className = 'hist-row';
        let html = `<span class="tag">${e.tag}</span><span class="name" style="flex:none;width:${maxNameW}px;">${e.name}</span>`;
        e.sets.forEach(s => {
          const reps = s.reps || '\u2013';
          const wt = s.weight || '\u2013';
          html += `<span class="hist-set">${reps}/${wt}</span>`;
        });
        row.innerHTML = html;
        app.appendChild(row);
      });
    });

    const rows = getHistoryRows(historyType);
    const curIdx = rows.findIndex(r => r.date.toDateString() === historySelected.date.toDateString());
    const canOlder = curIdx !== -1 && curIdx < rows.length - 1;
    const canNewer = curIdx > 0;

    buildBottomBar({
      rightButton: calBtn,
      middleButtons: [
        {svg: buildLeftChevron(), disabled: !canOlder, onclick: () => {
          if(canOlder){ historySelected = rows[curIdx + 1]; render(); }
        }},
        {svg: buildRightChevron(), disabled: !canNewer, onclick: () => {
          if(canNewer){ historySelected = rows[curIdx - 1]; render(); }
        }}
      ]
    });
    return;
  }

  const type = currentType;
  const draft = draftFor(type);

  const nameFont = '14px -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif';
  let maxNameWidth = 0;
  ['push','pull','legs','core'].forEach(t => {
    state.catalog[t].forEach(ex => {
      const w = measureTextWidth(ex.name, nameFont);
      if(w > maxNameWidth) maxNameWidth = w;
    });
  });
  maxNameWidth = Math.ceil(maxNameWidth) + 6;

  const colhead = document.createElement('div');
  colhead.className = 'colhead';
  colhead.innerHTML = '<span class="ch-tag"></span><span class="ch-name">exercise</span><span class="editctl"></span><span class="ch-scheme">sets</span><span class="ch-prev">max</span><span class="ch-done">✓</span>';
  colhead.querySelector('.ch-name').style.cssText = 'flex:none;width:' + maxNameWidth + 'px;';
  app.appendChild(colhead);

  state.exercises[type].forEach((ex, idx) => {
    const d = draft[ex.id];
    const isExpanded = expandedId === ex.id;
    const done = allSetsDone(d);

    const block = document.createElement('div');
    block.className = 'ex-block';

    const row = document.createElement('div');
    row.className = 'ex-row' + (done ? ' done' : '');

    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = ex.tag;
    row.appendChild(tag);

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = ex.name;
    name.style.flex = 'none';
    name.style.width = maxNameWidth + 'px';
    row.appendChild(name);

    const editCtl = document.createElement('div');
    editCtl.className = 'editctl' + (editMode ? '' : ' hidden-ctl');

    const rm = document.createElement('button');
    rm.className = 'rm';
    rm.textContent = '×';
    rm.tabIndex = editMode ? 0 : -1;
    rm.onclick = (ev) => {
      ev.stopPropagation();
      if(!editMode) return;
      state.exercises[type] = state.exercises[type].filter(e => e.id !== ex.id);
      delete draft[ex.id];
      save(); render();
    };
    editCtl.appendChild(rm);

    const reorder = document.createElement('div');
    reorder.className = 'reorder';
    const up = document.createElement('button');
    up.disabled = idx === 0;
    up.tabIndex = editMode ? 0 : -1;
    up.appendChild(buildChevron('up'));
    up.onclick = (ev) => {
      ev.stopPropagation();
      if(!editMode || idx === 0) return;
      const arr = state.exercises[type];
      [arr[idx-1], arr[idx]] = [arr[idx], arr[idx-1]];
      save(); render();
    };
    const down = document.createElement('button');
    down.disabled = idx === state.exercises[type].length - 1;
    down.tabIndex = editMode ? 0 : -1;
    down.appendChild(buildChevron('down'));
    down.onclick = (ev) => {
      ev.stopPropagation();
      if(!editMode) return;
      const arr = state.exercises[type];
      if(idx === arr.length - 1) return;
      [arr[idx+1], arr[idx]] = [arr[idx], arr[idx+1]];
      save(); render();
    };
    reorder.appendChild(up);
    reorder.appendChild(down);
    editCtl.appendChild(reorder);

    row.appendChild(editCtl);

    const scheme = document.createElement('span');
    scheme.className = 'scheme';
    scheme.textContent = ex.scheme;
    row.appendChild(scheme);

    const prev = document.createElement('span');
    prev.className = 'prev';
    prev.textContent = prevMax(ex.id) || '—';
    row.appendChild(prev);

    const doneMark = document.createElement('span');
    doneMark.className = 'doneMark';
    doneMark.textContent = done ? '✓' : '';
    row.appendChild(doneMark);

    row.onclick = () => {
      expandedId = isExpanded ? null : ex.id;
      render();
    };
    block.appendChild(row);

    if(isExpanded){
      const panel = document.createElement('div');
      panel.className = 'setpanel';

      const sch = document.createElement('div');
      sch.className = 'set-colhead';
      sch.innerHTML = '<span class="sc-num">set</span><span class="sc-reps">reps</span><span class="sc-weight">weight</span><span class="sc-done">done</span>';
      panel.appendChild(sch);

      d.sets.forEach((s, si) => {
        const sr = document.createElement('div');
        sr.className = 'setrow' + (s.done ? ' done' : '');

        const num = document.createElement('span');
        num.className = 'set-num';
        num.textContent = si + 1;
        sr.appendChild(num);

        const reps = document.createElement('input');
        reps.className = 'set-reps';
        reps.type = 'number'; reps.inputMode = 'numeric';
        reps.value = s.reps;
        reps.onclick = (ev) => ev.stopPropagation();
        reps.oninput = (e) => { s.reps = e.target.value; save(); };
        sr.appendChild(reps);

        const weight = document.createElement('input');
        weight.className = 'set-weight';
        weight.type = 'number'; weight.inputMode = 'decimal';
        weight.value = s.weight;
        weight.onclick = (ev) => ev.stopPropagation();
        weight.oninput = (e) => { s.weight = e.target.value; save(); };
        sr.appendChild(weight);

        const doneBtn = document.createElement('button');
        doneBtn.className = 'set-done';
        doneBtn.textContent = s.done ? '✓' : '_';
        doneBtn.onclick = (ev) => {
          ev.stopPropagation();
          s.done = !s.done;
          save();
          if(allSetsDone(d)){
            const mode = modeReps(d.sets);
            if(mode !== null) ex.scheme = d.sets.length + 'x' + mode;
            save();
            expandedId = null;
          }
          render();
        };
        sr.appendChild(doneBtn);

        panel.appendChild(sr);
      });

      const ctl = document.createElement('div');
      const addSet = document.createElement('button');
      addSet.className = 'setctl';
      addSet.textContent = '+';
      addSet.onclick = (ev) => {
        ev.stopPropagation();
        const maxW = state.maxWeights[ex.id];
        d.sets.push({
          reps: schemeReps(ex.scheme) ? String(schemeReps(ex.scheme)) : '',
          weight: maxW ? String(maxW) : '',
          done:false
        });
        ex.scheme = withSetCount(ex.scheme, d.sets.length);
        save(); render();
      };
      ctl.appendChild(addSet);
      if(d.sets.length > 1){
        const rmSet = document.createElement('button');
        rmSet.className = 'setctl';
        rmSet.textContent = '\u2212';
        rmSet.onclick = (ev) => {
          ev.stopPropagation();
          d.sets.pop();
          ex.scheme = withSetCount(ex.scheme, d.sets.length);
          save(); render();
        };
        ctl.appendChild(rmSet);
      }
      panel.appendChild(ctl);

      block.appendChild(panel);
    }

    app.appendChild(block);
  });

  const remaining = state.catalog[type].filter(c => !state.exercises[type].some(e => e.id === c.id));
  if(remaining.length > 0){
    const pickLabel = document.createElement('div');
    pickLabel.style.cssText = 'font-size:11px;color:var(--dim);margin:10px 0 4px;';
    pickLabel.textContent = 'add from list';
    app.appendChild(pickLabel);

    remaining.forEach(c => {
      const row = document.createElement('div');
      row.className = 'stat-row';
      row.innerHTML = `<span class="tag">${c.tag}</span><span class="name">${c.name}</span>`;
      row.onclick = () => {
        const scheme = '3x10';
        state.exercises[type].push({id: c.id, tag: c.tag, name: c.name, scheme});
        draft[c.id] = {sets: emptySets(schemeSetCount(scheme), scheme, state.maxWeights[c.id])};
        save(); render();
      };
      app.appendChild(row);
    });
  }

  if(editMode){
    const addrow = document.createElement('div');
    addrow.className = 'addrow';
    addrow.innerHTML = `
      <input class="tag" id="nTag" placeholder="tag" maxlength="3">
      <input class="n" id="nName" placeholder="new custom exercise">
      <input class="s" id="nScheme" placeholder="3x10">
      <button class="addbtn" id="addBtn">+ add to catalog</button>
    `;
    app.appendChild(addrow);
    document.getElementById('addBtn').onclick = () => {
      const tag = document.getElementById('nTag').value.trim().toUpperCase() || 'EX';
      const name = document.getElementById('nName').value.trim();
      const scheme = document.getElementById('nScheme').value.trim() || '3x10';
      if(!name) return;
      const id = type + '-' + name.toLowerCase().replace(/[^a-z0-9]+/g,'-') + '-' + Date.now();
      state.catalog[type].push({id, tag, name});
      state.exercises[type].push({id, tag, name, scheme});
      draft[id] = {sets: emptySets(schemeSetCount(scheme), scheme, null)};
      save(); render();
    };
  }

  const footer = document.createElement('div');
  footer.className = 'footer';
  const clearBtn = document.createElement('button');
  clearBtn.className = 'footerBtn';
  clearBtn.appendChild(buildUndoIcon());
  clearBtn.onclick = () => {
    showModal('Are you sure? This will clear today\'s entries.', {
      onConfirm: () => {
        state.exercises[type].forEach(ex => {
          draft[ex.id] = {sets: emptySets(schemeSetCount(ex.scheme), ex.scheme, state.maxWeights[ex.id])};
        });
        expandedId = null;
        save(); render();
      }
    });
  };
  const saveBtn = document.createElement('button');
  saveBtn.className = 'footerBtn';
  saveBtn.appendChild(buildCheckIcon());
  saveBtn.onclick = () => {
    showModal('Are you sure you want to save this workout?', {
      onConfirm: () => {
        const entries = state.exercises[type].map(ex => {
          const d = draft[ex.id];
          d.sets.forEach(s => {
            const w = parseFloat(s.weight);
            if(!isNaN(w)){
              const prev = state.maxWeights[ex.id] || 0;
              if(w > prev) state.maxWeights[ex.id] = w;
            }
          });
          return {exerciseId:ex.id, tag:ex.tag, name:ex.name, scheme:ex.scheme, sets: d.sets.map(s=>({reps:s.reps,weight:s.weight}))};
        });
        state.history[type].unshift({date:new Date().toISOString(), type, entries});
        state.exercises[type].forEach(ex => {
          draft[ex.id] = {sets: emptySets(schemeSetCount(ex.scheme), ex.scheme, state.maxWeights[ex.id])};
        });
        expandedId = null;
        save(); render();

        const ghCfg = loadGhConfig();
        if(ghCfg.owner && ghCfg.repo && ghCfg.path && ghCfg.token){
          const toastProxy = { set textContent(v){ showToast(v); } };
          ghPush(ghCfg, toastProxy);
        }
      }
    });
  };
  footer.appendChild(clearBtn);
  footer.appendChild(saveBtn);
  app.appendChild(footer);
  placeFixedButtons(true, footer);
}

const fsBtn = document.createElement('button');
fsBtn.textContent = '\u26F6';
function styleFsBtn(){
  const active = !!document.fullscreenElement;
  const color = active ? '#eee' : '#666';
  const underline = 'border-bottom:2px solid ' + (active ? '#eee' : 'transparent') + ';';
  if(fixedBtnsDocked){
    fsBtn.style.cssText = 'flex:1;background:none;border:none;' + underline +
      'color:' + color + ';font-size:20px;font-family:inherit;height:100%;display:flex;align-items:center;justify-content:center;';
  } else {
    fsBtn.style.cssText = 'position:fixed;bottom:6px;left:8px;z-index:60;background:none;border:none;' +
      underline + 'color:' + color + ';font-size:18px;font-family:inherit;padding:4px 6px;';
  }
}
fsBtn.onclick = () => {
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
};
document.addEventListener('fullscreenchange', styleFsBtn);

const editFixedBtn = document.createElement('button');
editFixedBtn.textContent = '\u2630';
function styleEditFixedBtn(){
  const active = editMode || adminPanelOpen;
  const color = active ? '#eee' : '#666';
  const underline = 'border-bottom:2px solid ' + (active ? '#eee' : 'transparent') + ';';
  if(fixedBtnsDocked){
    editFixedBtn.style.cssText = 'flex:1;background:none;border:none;' + underline +
      'color:' + color + ';font-size:20px;font-family:inherit;height:100%;display:flex;align-items:center;justify-content:center;';
  } else {
    editFixedBtn.style.cssText = 'position:fixed;bottom:6px;right:8px;z-index:60;background:none;border:none;' +
      underline + 'color:' + color + ';font-size:18px;font-family:inherit;padding:4px 6px;';
  }
}

let editPressTimer = null;
let editLongPressFired = false;

function startEditPress(ev){
  ev.preventDefault();
  editLongPressFired = false;
  editPressTimer = setTimeout(() => {
    editLongPressFired = true;
    adminPanelOpen = !adminPanelOpen;
    styleEditFixedBtn();
    render();
  }, 650);
}
function endEditPress(){
  clearTimeout(editPressTimer);
  if(!editLongPressFired){
    editMode = !editMode;
    styleEditFixedBtn();
    render();
  }
}
editFixedBtn.addEventListener('pointerdown', startEditPress);
editFixedBtn.addEventListener('pointerup', endEditPress);
editFixedBtn.addEventListener('pointerleave', () => clearTimeout(editPressTimer));
editFixedBtn.addEventListener('contextmenu', (ev) => ev.preventDefault());

let fixedBtnsDocked = false;

function dockFsBtn(footerEl){
  fixedBtnsDocked = true;
  styleFsBtn();
  footerEl.insertBefore(fsBtn, footerEl.firstChild);
}

function dockEditBtn(footerEl){
  fixedBtnsDocked = true;
  styleEditFixedBtn();
  footerEl.appendChild(editFixedBtn);
}

function placeFixedButtons(docked, footerEl){
  fixedBtnsDocked = docked;
  styleFsBtn();
  styleEditFixedBtn();
  if(docked && footerEl){
    footerEl.insertBefore(fsBtn, footerEl.firstChild);
    footerEl.appendChild(editFixedBtn);
  } else {
    document.body.appendChild(fsBtn);
    document.body.appendChild(editFixedBtn);
  }
}

render();
</script>
</body>
</html>
